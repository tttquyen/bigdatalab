# =============================================================================
#  CT428 — DỊCH VỤ BỔ SUNG (Lab 3, 4, 6): Hive 4.2.1 · HBase 2.6.7 · Kafka 4.3.1 · MongoDB 8.0
#  LUÔN chạy CHỒNG lên cụm lõi (cùng project, cùng mạng):
#    docker compose -f docker-compose.yml -f docker-compose.extras.yml up -d
#  Chỉ bật dịch vụ cần cho từng bài (tiết kiệm RAM), ví dụ:
#    Lab 3 (Hive):          ... up -d hiveserver2          (tự kéo theo metastore + Postgres)
#    Lab 4 (HBase, Mongo):  ... up -d hbase mongodb
#    Lab 6 (Kafka):         ... up -d kafka
#  Tổng mem_limit extras: 6.75 GB; RAM đo thực tế khi rảnh ~2.5 GB (HiveServer2 ~1 GB).
# =============================================================================
x-restart: &restart
  restart: unless-stopped

services:
  # ---------------- Hive 4.2.1: Postgres + Metastore + HiveServer2 ----------------
  hive-metastore-db:
    <<: *restart
    image: postgres:16
    container_name: ${CT_PREFIX:-}hive-metastore-db
    hostname: hive-metastore-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes: ["hive-metastore-db:/var/lib/postgresql/data"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  hive-metastore:
    <<: *restart
    image: apache/hive:4.2.1
    container_name: ${CT_PREFIX:-}hive-metastore
    hostname: hive-metastore
    ports: ["9083:9083"]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      DEFAULT_FS: hdfs://namenode:9000
      HIVE_WAREHOUSE_PATH: /user/hive/warehouse
      HIVE_SCRATCH_DIR: /tmp/hive
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx768m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - ./conf/hive:/hive_custom_conf:ro
      - ./hive/ext-jars:/tmp/ext-jars:ro
    mem_limit: 1g
    depends_on:
      hive-metastore-db: {condition: service_healthy}
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  hiveserver2:
    <<: *restart
    image: apache/hive:4.2.1
    container_name: ${CT_PREFIX:-}hiveserver2
    hostname: hiveserver2
    ports: ["10000:10000", "10002:10002"]
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      DEFAULT_FS: hdfs://namenode:9000
      HIVE_WAREHOUSE_PATH: /user/hive/warehouse
      HIVE_SCRATCH_DIR: /tmp/hive
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx1536m
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Dhive.exec.dynamic.partition.mode=nonstrict
    volumes:
      - ./conf/hive:/hive_custom_conf:ro
      - ./data:/data
      - ./src:/src
    mem_limit: 2g
    depends_on:
      hive-metastore: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  # ---------------- Kafka 4.3.1 KRaft (không ZooKeeper) ----------------
  #  Trong mạng Docker: kafka:9092   ·   Từ máy host: localhost:9092 (map vào listener EXTERNAL 9094)
  kafka:
    <<: *restart
    image: apache/kafka:4.3.1
    container_name: ${CT_PREFIX:-}kafka
    hostname: kafka
    ports: ["9092:9094"]
    environment:
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes: ["kafka:/var/lib/kafka/data"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 20s

  # ---------------- HBase 2.6.7 standalone, dữ liệu trên HDFS (/hbase) ----------------
  #  Master UI 16010 · RegionServer UI 16030 · Thrift (happybase) 9090
  hbase:
    <<: *restart
    image: bigdata-lab:2026.10
    pull_policy: never
    container_name: ${CT_PREFIX:-}hbase
    hostname: hbase
    command: ["hbase"]
    ports: ["16010:16010", "16030:16030", "9090:9090"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      HBASE_HEAPSIZE: 768m
      HADOOP_HEAPSIZE_MAX: 256m
    volumes:
      - hbase:/hbase-data
      - ./data:/data
      - ./src:/src
    mem_limit: 1536m
    depends_on:
      namenode: {condition: service_healthy}
      datanode1: {condition: service_healthy}
      datanode2: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:16010/jmx?qry=Hadoop:service=HBase,name=Master,sub=Server | grep -q numRegionServers && bash -c 'echo > /dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  # ---------------- MongoDB 8.0 (không bật xác thực — chỉ dùng cho lớp học) ----------------
  mongodb:
    <<: *restart
    image: mongo:8.0
    container_name: ${CT_PREFIX:-}mongodb
    hostname: mongodb
    ports: ["27017:27017"]
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      # Kernel Linux 6.19–7.0.13 (Ubuntu 26.04, Fedora 43, WSL2 mới...) xung đột TCMalloc của MongoDB 8 (SERVER-121912):
      # mongod từ chối khởi động. Biến dưới là cách khắc phục được cộng đồng xác nhận; vô hại trên kernel cũ.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb:/data/db
      - ./data:/import
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

volumes:
  hive-metastore-db:
  kafka:
  hbase:
  mongodb:
