# =============================================================================
#  CT428 "Xử lý dữ liệu lớn" — CỤM LÕI (8 container, 1 image bigdata-lab:2026.10)
#  Hadoop 3.4.3 (HDFS + YARN + MapReduce) · Spark 4.1.3 standalone + on YARN
#
#  Build image : docker compose build
#  Khởi động   : docker compose up -d
#  Dừng        : docker compose down          (giữ dữ liệu HDFS)
#  Xoá sạch    : docker compose down -v       (xoá cả volume HDFS)
#  Thêm extras : docker compose -f docker-compose.yml -f docker-compose.extras.yml up -d
#
#  Tổng mem_limit cụm lõi: 11,5 GB (giới hạn trần, không phải mức dùng thực).
#  RAM đo thực tế: rảnh ~2.3 GB, đỉnh ~4.7 GB khi chạy MR + Spark đồng thời (README.md mục 10).
#  CT_PREFIX (mặc định rỗng) chỉ dùng khi kiểm thử song song nhiều cụm: xem TESTING.md
# =============================================================================
name: bigdata-lab

x-lab: &lab
  image: bigdata-lab:2026.10
  pull_policy: never
  restart: unless-stopped
  environment: &lab-env
    TZ: Asia/Ho_Chi_Minh

services:
  namenode:
    <<: *lab
    build:
      context: .
      tags: ["bigdata-lab:latest"]
      network: host   # build dùng mạng của máy host (tránh lỗi DNS "Temporary failure resolving" của BuildKit)
      args:
        # Mirror tải Hadoop/Spark/HBase, thử lần lượt. Đổi bằng tệp .env (APACHE_MIRROR=...) hoặc
        # docker compose build --build-arg APACHE_MIRROR="<url1> <url2>"
        APACHE_MIRROR: ${APACHE_MIRROR:-https://downloads.apache.org https://mirrors.aliyun.com/apache https://archive.apache.org/dist}
    pull_policy: missing   # chỉ build khi máy chưa có image bigdata-lab:2026.10
    container_name: ${CT_PREFIX:-}namenode
    hostname: namenode
    command: ["namenode"]
    ports: ["9870:9870", "9000:9000"]
    environment:
      <<: *lab-env
      HADOOP_HEAPSIZE_MAX: 512m
    volumes:
      - namenode:/hadoop/dfs/name
      - ./data:/data
      - ./src:/src
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus | grep -q active"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  datanode1:
    <<: *lab
    container_name: ${CT_PREFIX:-}datanode1
    hostname: datanode1
    command: ["datanode"]
    ports: ["9864:9864"]
    environment:
      <<: *lab-env
      HADOOP_HEAPSIZE_MAX: 256m
    volumes: ["datanode1:/hadoop/dfs/data"]
    mem_limit: 768m
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck: &dn-health
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  datanode2:
    <<: *lab
    container_name: ${CT_PREFIX:-}datanode2
    hostname: datanode2
    command: ["datanode"]
    ports: ["9865:9864"]
    environment:
      <<: *lab-env
      HADOOP_HEAPSIZE_MAX: 256m
    volumes: ["datanode2:/hadoop/dfs/data"]
    mem_limit: 768m
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck: *dn-health

  resourcemanager:
    <<: *lab
    container_name: ${CT_PREFIX:-}resourcemanager
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports: ["8088:8088"]
    environment:
      <<: *lab-env
      HADOOP_HEAPSIZE_MAX: 512m
    mem_limit: 1g
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/ws/v1/cluster/info | grep -q STARTED"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  spark-master:
    <<: *lab
    container_name: ${CT_PREFIX:-}spark-master
    hostname: spark-master
    command: ["spark-master"]
    # 8080 Web UI Master · 7077 cổng submit · 4040 Spark UI của driver chạy trong container này
    ports: ["8080:8080", "7077:7077", "4040:4040"]
    environment:
      <<: *lab-env
      SPARK_DAEMON_MEMORY: 256m
      HADOOP_HEAPSIZE_MAX: 256m
    volumes:
      - ./data:/data
      - ./src:/src
    mem_limit: 2g
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/json/ | grep -q ALIVE"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  nodemanager1:
    <<: *lab
    container_name: ${CT_PREFIX:-}nodemanager1
    hostname: nodemanager1
    command: ["nodemanager"]
    ports: ["8042:8042"]
    environment: &nm-env
      <<: *lab-env
      HADOOP_HEAPSIZE_MAX: 384m
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1g
    volumes:
      - ./data:/data
      - ./src:/src
    mem_limit: 2560m
    depends_on: &nm-deps
      resourcemanager: {condition: service_healthy}
      spark-master: {condition: service_healthy}
      datanode1: {condition: service_healthy}
      datanode2: {condition: service_healthy}
    healthcheck: &nm-health
      test: ["CMD-SHELL", "curl -sf http://localhost:8042/ws/v1/node/info | grep -q nodeHealthy && curl -sf http://localhost:8081/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  nodemanager2:
    <<: *lab
    container_name: ${CT_PREFIX:-}nodemanager2
    hostname: nodemanager2
    command: ["nodemanager"]
    ports: ["8043:8042"]
    environment: *nm-env
    volumes:
      - ./data:/data
      - ./src:/src
    mem_limit: 2560m
    depends_on: *nm-deps
    healthcheck: *nm-health

  historyserver:
    <<: *lab
    container_name: ${CT_PREFIX:-}historyserver
    hostname: historyserver
    command: ["historyserver"]
    # 18080 Spark History Server · 19888 MapReduce JobHistory
    ports: ["18080:18080", "19888:19888"]
    environment:
      <<: *lab-env
      HADOOP_HEAPSIZE_MAX: 256m
      SPARK_DAEMON_MEMORY: 384m
    mem_limit: 1g
    depends_on:
      namenode: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/ >/dev/null && curl -sf http://localhost:19888/ws/v1/history/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  namenode:
  datanode1:
  datanode2:
