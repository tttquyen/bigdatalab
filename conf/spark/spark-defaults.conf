# spark-defaults.conf — cụm thực hành CT428 (Spark 4.1.3)
# Không đặt spark.master: luôn ghi rõ --master khi chạy
#   Standalone : --master spark://spark-master:7077
#   YARN       : --master yarn   (deploy-mode client mặc định)
#   Cục bộ     : --master local[*]

# Event log trên HDFS -> Spark History Server (http://localhost:18080)
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory     hdfs://namenode:9000/spark-logs
spark.history.ui.port             18080
spark.history.fs.update.interval  10s
spark.yarn.historyServer.address  historyserver:18080

# Spark trên YARN: dùng jar có sẵn trong image ở mọi NodeManager (không upload ~400 MB mỗi lần submit)
spark.yarn.jars                   local:/opt/spark/jars/*

# Bộ nhớ vừa với laptop 8 GB: mỗi Spark Worker có 1 GB, executor 768 MB
spark.driver.memory               768m
spark.executor.memory             768m

# Bảng quản lý (saveAsTable) ghi lên HDFS; metastore Derby nhúng đặt ở /tmp/spark-derby
spark.sql.warehouse.dir           hdfs://namenode:9000/user/spark/warehouse
spark.driver.extraJavaOptions     -Dderby.system.home=/tmp/spark-derby

# Spark 4 bật ANSI SQL mặc định (spark.sql.ansi.enabled=true). Giữ mặc định để học đúng chuẩn mới;
# nếu bài lab cũ cần hành vi Spark 3 (ép kiểu lỗi -> NULL), thêm: --conf spark.sql.ansi.enabled=false

# Spark 4 mặc định ghi log dạng JSON (structured logging); tắt để log dễ đọc như Spark 3
spark.log.structuredLogging.enabled false
